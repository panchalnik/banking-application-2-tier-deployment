name: Test Fleet Health and Env Variables

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720800607391:role/github-action-deploy-role
          aws-region: us-east-1

      - name: Check Fleet Health and Environment
        run: |
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:App,Values=flask" \
            --document-name "AWS-RunShellScript" \
            --parameters '{
              "commands":[
                "echo ===== HOSTNAME =====",
                "hostname",
                "echo ===== PRIVATE IP =====",
                "hostname -I",
                "echo ===== DOCKER VERSION =====",
                "docker --version 2>/dev/null || echo DOCKER NOT INSTALLED",
                "echo ===== AWS CLI VERSION =====",
                "aws --version 2>/dev/null || echo AWS CLI NOT INSTALLED",
                "echo ===== MYSQL VERSION =====",
                "mysql --version 2>/dev/null || echo MYSQL NOT INSTALLED",
                "echo ===== APPLICATION PARAMETERS =====",
                "aws ssm get-parameters-by-path --path /application/banking --with-decryption --region us-east-1 || echo PARAMETERS NOT FOUND"
              ]
            }' \
            --query "Command.CommandId" \
            --output text \
            --region us-east-1)

          echo "Command ID: $CMD_ID"

          sleep 30

          aws ssm list-command-invocations \
            --command-id "$CMD_ID" \
            --details \
            --query "CommandInvocations[*].{Instance:InstanceId,Output:CommandPlugins[0].Output}" \
            --output table