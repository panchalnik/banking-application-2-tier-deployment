service:

  simplebank_app:
    image:
    container_name: simplebank_app
    ports:
      -"5000:5000"
    environment:
      - FLASK_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:5000/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 20s 
      
          
